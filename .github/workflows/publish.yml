name: Publish @lifeup/mcp

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: mcp-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve next patch version
        id: version
        run: |
          LATEST=$(npm view @lifeup/mcp@latest version --registry=https://registry.npmjs.org)
          npm version "$LATEST" --allow-same-version --no-git-tag-version
          npm version patch --no-git-tag-version
          TARGET=$(node -p "require('./package.json').version")
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      # prepublishOnly runs the full test suite and build before uploading.
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org

      - name: Commit version bump back
        env:
          TARGET: ${{ steps.version.outputs.target }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp/package.json mcp/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(mcp): bump version to ${TARGET} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
